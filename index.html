<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Naja – Snake mit Giftspur</title>
<style>
  :root {
    --bg: #0e1a14;
    --grid: #14241c;
    --snake: #6ee7a0;
    --snake-head: #a7f3d0;
    --food: #ef4444;
    --poison: #7c3aed;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2e23 0%, var(--bg) 60%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 28px;
    letter-spacing: 2px;
  }
  .subtitle { color: var(--muted); margin-bottom: 16px; font-size: 14px; }
  .hud {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }
  .hud span b { color: var(--snake); }
  canvas {
    background: var(--grid);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    image-rendering: pixelated;
    touch-action: none;
  }
  .controls {
    margin-top: 14px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    max-width: 460px;
    line-height: 1.5;
  }
  kbd {
    background: #1f2937;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 12px;
    color: var(--text);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .stage { position: relative; }
  .banner {
    background: rgba(14, 26, 20, 0.85);
    border: 1px solid #1f2937;
    padding: 16px 24px;
    border-radius: 10px;
    text-align: center;
    backdrop-filter: blur(4px);
  }
  .banner h2 { margin: 0 0 6px; }
  .banner p { margin: 0; color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>NAJA</h1>
  <div class="subtitle">Snake mit Giftspur – trete nicht in dein eigenes Gift</div>

  <div class="hud">
    <span>Score <b id="score">0</b></span>
    <span>Best <b id="best">0</b></span>
    <span>Speed <b id="speed">1</b></span>
  </div>

  <div class="stage">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <div class="banner" id="banner">
        <h2 id="banner-title">Bereit?</h2>
        <p id="banner-text">Drücke <kbd>Leertaste</kbd> oder tippe zum Starten</p>
      </div>
    </div>
  </div>

  <div class="controls">
    Steuerung: <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> oder <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ·
    Pause: <kbd>P</kbd> · Neu: <kbd>R</kbd><br />
    Jeder 5. Apfel hinterlässt Giftfelder. Gift verschwindet nach 6 Sekunden.
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const COLS = 24, ROWS = 24;
  const CELL = canvas.width / COLS;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const bannerTitle = document.getElementById('banner-title');
  const bannerText = document.getElementById('banner-text');

  const STATE = { READY: 0, PLAYING: 1, PAUSED: 2, OVER: 3 };
  let state = STATE.READY;

  let snake, dir, nextDir, food, poison, score, best, tickMs, lastTick, appleCount;

  best = parseInt(localStorage.getItem('naja-best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 12, y: 12}, {x: 11, y: 12}, {x: 10, y: 12}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    poison = [];
    score = 0;
    appleCount = 0;
    tickMs = 130;
    lastTick = 0;
    scoreEl.textContent = score;
    speedEl.textContent = '1';
    spawnFood();
  }

  function spawnFood() {
    while (true) {
      const x = (Math.random() * COLS) | 0;
      const y = (Math.random() * ROWS) | 0;
      if (snake.some(s => s.x === x && s.y === y)) continue;
      if (poison.some(p => p.x === x && p.y === y)) continue;
      food = {x, y};
      return;
    }
  }

  function showBanner(title, text) {
    bannerTitle.textContent = title;
    bannerText.innerHTML = text;
    overlay.classList.remove('hidden');
  }
  function hideBanner() { overlay.classList.add('hidden'); }

  function start() {
    reset();
    state = STATE.PLAYING;
    hideBanner();
    lastTick = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = STATE.OVER;
    if (score > best) {
      best = score;
      localStorage.setItem('naja-best', String(best));
      bestEl.textContent = best;
    }
    showBanner('Game Over', `Score: <b>${score}</b><br/>Drücke <kbd>R</kbd> oder tippe für neu`);
  }

  function tick() {
    dir = nextDir;
    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return gameOver();
    if (snake.some((s, i) => i !== snake.length - 1 && s.x === nx && s.y === ny)) return gameOver();
    if (poison.some(p => p.x === nx && p.y === ny)) return gameOver();

    const newHead = {x: nx, y: ny};
    snake.unshift(newHead);

    if (nx === food.x && ny === food.y) {
      score += 10;
      scoreEl.textContent = score;
      appleCount++;
      if (tickMs > 60) tickMs -= 3;
      speedEl.textContent = Math.max(1, Math.round((130 - tickMs) / 10) + 1);

      if (appleCount % 5 === 0) {
        const tail = snake[snake.length - 1];
        poison.push({x: tail.x, y: tail.y, until: performance.now() + 6000});
      }
      spawnFood();
    } else {
      snake.pop();
    }

    const now = performance.now();
    poison = poison.filter(p => p.until > now);
  }

  function draw() {
    ctx.fillStyle = '#14241c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
    }

    const now = performance.now();
    for (const p of poison) {
      const remaining = (p.until - now) / 6000;
      ctx.fillStyle = `rgba(124, 58, 237, ${0.3 + 0.5 * remaining})`;
      ctx.fillRect(p.x*CELL+1, p.y*CELL+1, CELL-2, CELL-2);
    }

    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
    ctx.fill();

    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      ctx.fillStyle = i === 0 ? '#a7f3d0' : '#6ee7a0';
      const pad = i === 0 ? 1 : 2;
      ctx.fillRect(s.x*CELL + pad, s.y*CELL + pad, CELL - pad*2, CELL - pad*2);
    }
  }

  function loop(now) {
    if (state !== STATE.PLAYING) return;
    if (now - lastTick >= tickMs) {
      lastTick = now;
      tick();
    }
    draw();
    requestAnimationFrame(loop);
  }

  function setDir(x, y) {
    if (snake.length > 1 && dir.x === -x && dir.y === -y) return;
    nextDir = {x, y};
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'enter') {
      if (state === STATE.READY || state === STATE.OVER) start();
      else if (state === STATE.PLAYING) { state = STATE.PAUSED; showBanner('Pause', 'Drücke <kbd>P</kbd> oder <kbd>Leertaste</kbd>'); }
      else if (state === STATE.PAUSED) { state = STATE.PLAYING; hideBanner(); lastTick = performance.now(); requestAnimationFrame(loop); }
      e.preventDefault();
    }
    if (k === 'p') {
      if (state === STATE.PLAYING) { state = STATE.PAUSED; showBanner('Pause', 'Drücke <kbd>P</kbd> zum Fortsetzen'); }
      else if (state === STATE.PAUSED) { state = STATE.PLAYING; hideBanner(); lastTick = performance.now(); requestAnimationFrame(loop); }
    }
    if (k === 'r') start();
    if (state !== STATE.PLAYING) return;
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    if (state === STATE.READY || state === STATE.OVER) { start(); return; }
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  });
  canvas.addEventListener('touchmove', (e) => {
    if (!touchStart) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
    e.preventDefault();
  }, { passive: false });

  reset();
  draw();
  showBanner('Bereit?', 'Drücke <kbd>Leertaste</kbd> oder tippe zum Starten');
})();
</script>
</body>
</html>
