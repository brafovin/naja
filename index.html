<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Teddy Chase</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0a14;
    color: #fff;
    font-family: system-ui, "Segoe UI", sans-serif;
    overflow: hidden;
    height: 100%;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #1a1825;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    max-width: 100%;
    max-height: 100%;
    cursor: crosshair;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 800;
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    pointer-events: none;
    text-align: center;
    font-size: 20px;
  }
  #hud .small { font-size: 13px; opacity: 0.9; font-weight: 600; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
</div>
<div id="hud">
  <div>⏱ <span id="time">0.0</span>s &nbsp; 🍯 <span id="honey">0</span></div>
  <div class="small">Teddys: <span id="teddyCount">1</span> &nbsp; Best: <span id="best">0</span></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const timeEl   = document.getElementById('time');
  const honeyEl  = document.getElementById('honey');
  const teddyCEl = document.getElementById('teddyCount');
  const bestEl   = document.getElementById('best');

  const BEST_KEY = 'teddyChase_best_v1';
  let best = parseFloat(localStorage.getItem(BEST_KEY) || '0');
  bestEl.textContent = best.toFixed(1);

  // ---------- Map ----------
  // Einfache Wände als Rechtecke für eine Karte mit ein paar Räumen
  const walls = [
    // Außenwände
    { x: 0,   y: 0,   w: W, h: 20 },
    { x: 0,   y: H-20, w: W, h: 20 },
    { x: 0,   y: 0,   w: 20, h: H },
    { x: W-20, y: 0,  w: 20, h: H },
    // Innenwände
    { x: 150, y: 80,  w: 20, h: 180 },
    { x: 150, y: 80,  w: 200, h: 20 },
    { x: 280, y: 200, w: 200, h: 20 },

    { x: 600, y: 100, w: 20, h: 220 },
    { x: 600, y: 100, w: 180, h: 20 },
    { x: 760, y: 200, w: 20, h: 120 },

    { x: 100, y: 380, w: 240, h: 20 },
    { x: 320, y: 380, w: 20, h: 140 },

    { x: 500, y: 420, w: 180, h: 20 },
    { x: 660, y: 420, w: 20, h: 140 },

    { x: 420, y: 280, w: 80, h: 20 },
    { x: 420, y: 280, w: 20, h: 80 },
  ];

  function rectOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function circleHitsWall(cx, cy, r) {
    for (const w of walls) {
      const nx = Math.max(w.x, Math.min(cx, w.x + w.w));
      const ny = Math.max(w.y, Math.min(cy, w.y + w.h));
      const dx = cx - nx, dy = cy - ny;
      if (dx * dx + dy * dy < r * r) return w;
    }
    return null;
  }

  function moveCircle(obj, dx, dy, r) {
    // Versucht X und Y getrennt -> rutscht an Wänden entlang
    if (!circleHitsWall(obj.x + dx, obj.y, r)) obj.x += dx;
    if (!circleHitsWall(obj.x, obj.y + dy, r)) obj.y += dy;
  }

  // Sichtlinie zwischen zwei Punkten (kein Wand-Block)
  function hasLineOfSight(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const dist = Math.hypot(dx, dy);
    const steps = Math.ceil(dist / 8);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const x = x1 + dx * t;
      const y = y1 + dy * t;
      for (const w of walls) {
        if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return false;
      }
    }
    return true;
  }

  // ---------- Game State ----------
  let player, teddies, honeys, particles;
  let running = false;
  let dead = false;
  let won = false;
  let elapsed = 0;
  let lastT = 0;
  let teddySpawnTimer = 0;

  const PLAYER_R = 14;
  const TEDDY_R  = 18;

  function safeSpawn(r, minDistFromPlayer = 0) {
    for (let i = 0; i < 200; i++) {
      const x = 40 + Math.random() * (W - 80);
      const y = 40 + Math.random() * (H - 80);
      if (circleHitsWall(x, y, r + 2)) continue;
      if (minDistFromPlayer > 0 && player) {
        const dx = x - player.x, dy = y - player.y;
        if (dx * dx + dy * dy < minDistFromPlayer * minDistFromPlayer) continue;
      }
      return { x, y };
    }
    return { x: W / 2, y: H / 2 };
  }

  function reset() {
    player = { x: W / 2, y: H - 80, vx: 0, vy: 0, angle: 0, walkT: 0 };
    teddies = [];
    honeys = [];
    particles = [];
    elapsed = 0;
    teddySpawnTimer = 0;
    spawnTeddy();
    // Honig-Gläser verstreuen
    for (let i = 0; i < 8; i++) {
      const p = safeSpawn(12, 80);
      honeys.push({ x: p.x, y: p.y, wob: Math.random() * Math.PI * 2 });
    }
    running = true;
    dead = false;
    won = false;
    lastT = performance.now();
  }

  function spawnTeddy() {
    const p = safeSpawn(TEDDY_R, 280);
    teddies.push({
      x: p.x, y: p.y,
      vx: 0, vy: 0,
      angle: 0,
      walkT: 0,
      seeT: 0,         // wie lange Spieler schon gesehen
      lastSeenX: 0,
      lastSeenY: 0,
      hasTarget: false,
      growl: 0,
    });
  }

  // ---------- Input ----------
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (!running && (e.key === ' ' || e.key === 'Enter')) {
      reset();
    }
  });
  window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
  });
  canvas.addEventListener('mousedown', () => {
    if (!running) reset();
  });

  // ---------- Update ----------
  function update(dt) {
    if (!running || dead) return;
    elapsed += dt;

    // Spieler bewegen
    let ax = 0, ay = 0;
    if (keys['arrowup']    || keys['w']) ay -= 1;
    if (keys['arrowdown']  || keys['s']) ay += 1;
    if (keys['arrowleft']  || keys['a']) ax -= 1;
    if (keys['arrowright'] || keys['d']) ax += 1;
    const mag = Math.hypot(ax, ay);
    if (mag > 0) {
      ax /= mag; ay /= mag;
      player.angle = Math.atan2(ay, ax);
      player.walkT += dt * 8;
    }
    const PLAYER_SPEED = 230; // px/s
    moveCircle(player, ax * PLAYER_SPEED * dt, ay * PLAYER_SPEED * dt, PLAYER_R);

    // Honig einsammeln
    for (let i = honeys.length - 1; i >= 0; i--) {
      const h = honeys[i];
      h.wob += dt * 4;
      const dx = h.x - player.x, dy = h.y - player.y;
      if (dx * dx + dy * dy < (PLAYER_R + 12) * (PLAYER_R + 12)) {
        honeys.splice(i, 1);
        for (let k = 0; k < 8; k++) {
          const a = Math.random() * Math.PI * 2;
          particles.push({
            x: h.x, y: h.y,
            vx: Math.cos(a) * 80, vy: Math.sin(a) * 80,
            life: 0.5, maxLife: 0.5,
            r: 2 + Math.random() * 2,
            c: '#ffc107',
          });
        }
      }
    }

    // Wenn alle Honiggläser eingesammelt -> Sieg!
    if (honeys.length === 0) {
      won = true;
      dead = true;
      running = false;
      saveBest();
      return;
    }

    // Neue Teddys spawnen alle 25 Sekunden, max 5
    teddySpawnTimer += dt;
    if (teddySpawnTimer > 25 && teddies.length < 5) {
      spawnTeddy();
      teddySpawnTimer = 0;
    }

    // Teddys updaten
    for (const t of teddies) {
      const dx = player.x - t.x, dy = player.y - t.y;
      const dist = Math.hypot(dx, dy);
      const sees = hasLineOfSight(t.x, t.y, player.x, player.y) && dist < 360;

      // Teddy-Geschwindigkeit: leicht langsamer als Spieler, steigt mit Zeit
      const baseSpeed = 140;
      const speed = baseSpeed + Math.min(60, elapsed * 0.8);

      let tx, ty;
      if (sees) {
        t.seeT += dt;
        t.lastSeenX = player.x;
        t.lastSeenY = player.y;
        t.hasTarget = true;
        tx = player.x;
        ty = player.y;
        t.growl = Math.max(t.growl, 1);
      } else {
        t.seeT = Math.max(0, t.seeT - dt);
        if (t.hasTarget) {
          tx = t.lastSeenX;
          ty = t.lastSeenY;
          const ddx = tx - t.x, ddy = ty - t.y;
          if (Math.hypot(ddx, ddy) < 8) {
            t.hasTarget = false;
          }
        } else {
          // Patrouille: langsames Wandern
          if (!t.patrolX || Math.hypot(t.patrolX - t.x, t.patrolY - t.y) < 20) {
            const p = safeSpawn(TEDDY_R);
            t.patrolX = p.x;
            t.patrolY = p.y;
          }
          tx = t.patrolX;
          ty = t.patrolY;
        }
      }

      const ddx = tx - t.x, ddy = ty - t.y;
      const dd = Math.hypot(ddx, ddy);
      let nx = 0, ny = 0;
      if (dd > 0.5) {
        nx = ddx / dd;
        ny = ddy / dd;
      }
      const moveSpeed = t.hasTarget ? speed : speed * 0.45;
      moveCircle(t, nx * moveSpeed * dt, ny * moveSpeed * dt, TEDDY_R);
      if (Math.abs(nx) + Math.abs(ny) > 0.1) {
        t.angle = Math.atan2(ny, nx);
        t.walkT += dt * 6;
      }
      if (t.growl > 0) t.growl -= dt;

      // Treffer?
      const phx = player.x - t.x, phy = player.y - t.y;
      if (phx * phx + phy * phy < (PLAYER_R + TEDDY_R - 4) ** 2) {
        die();
        return;
      }
    }

    // Partikel
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.92;
      p.vy *= 0.92;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    timeEl.textContent = elapsed.toFixed(1);
    honeyEl.textContent = 8 - honeys.length;
    teddyCEl.textContent = teddies.length;
  }

  function die() {
    dead = true;
    running = false;
    saveBest();
    // Sturzpartikel
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      particles.push({
        x: player.x, y: player.y,
        vx: Math.cos(a) * 150, vy: Math.sin(a) * 150,
        life: 1, maxLife: 1,
        r: 3 + Math.random() * 2,
        c: '#e63946',
      });
    }
  }

  function saveBest() {
    if (elapsed > best) {
      best = elapsed;
      localStorage.setItem(BEST_KEY, String(best));
      bestEl.textContent = best.toFixed(1);
    }
  }

  // ---------- Zeichnen ----------
  function drawFloor() {
    ctx.fillStyle = '#1a1825';
    ctx.fillRect(0, 0, W, H);
    // Holzboden-Linien
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y); ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawWalls() {
    for (const w of walls) {
      ctx.fillStyle = '#3a2e4a';
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.fillStyle = '#52406a';
      ctx.fillRect(w.x, w.y, w.w, 3);
      ctx.fillStyle = '#231a30';
      ctx.fillRect(w.x, w.y + w.h - 3, w.w, 3);
    }
  }

  function drawHoneys() {
    for (const h of honeys) {
      const wob = Math.sin(h.wob) * 2;
      ctx.save();
      ctx.translate(h.x, h.y + wob);
      // Glow
      const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 24);
      g.addColorStop(0, 'rgba(255, 200, 80, 0.5)');
      g.addColorStop(1, 'rgba(255, 200, 80, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.fill();
      // Glas
      ctx.fillStyle = '#ffb300';
      ctx.beginPath();
      ctx.ellipse(0, 0, 10, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd54f';
      ctx.beginPath();
      ctx.ellipse(-3, -3, 3, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      // Deckel
      ctx.fillStyle = '#6b4226';
      ctx.fillRect(-8, -13, 16, 4);
      ctx.restore();
    }
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);

    // Schatten
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 10, 14, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(player.angle + Math.PI / 2);

    const bob = Math.abs(Math.sin(player.walkT)) * 1.5;
    ctx.translate(0, -bob);

    // Beine
    const legS = Math.sin(player.walkT) * 4;
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(-7, 6, 5, 10 + legS * 0.3);
    ctx.fillRect( 2, 6, 5, 10 - legS * 0.3);

    // Körper (T-Shirt)
    ctx.fillStyle = '#4caf50';
    ctx.beginPath();
    ctx.ellipse(0, 0, 11, 13, 0, 0, Math.PI * 2);
    ctx.fill();

    // Arme
    const armS = -Math.sin(player.walkT) * 3;
    ctx.fillStyle = '#fdd9b5';
    ctx.beginPath();
    ctx.ellipse(-11, 2 + armS, 4, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse( 11, 2 - armS, 4, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Kopf
    ctx.fillStyle = '#fdd9b5';
    ctx.beginPath();
    ctx.arc(0, -10, 8, 0, Math.PI * 2);
    ctx.fill();

    // Haare
    ctx.fillStyle = '#3b2412';
    ctx.beginPath();
    ctx.arc(0, -12, 8, Math.PI, 2 * Math.PI);
    ctx.fill();

    // Augen
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-3, -10, 2, 0, Math.PI * 2);
    ctx.arc( 3, -10, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-3, -10, 1, 0, Math.PI * 2);
    ctx.arc( 3, -10, 1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawTeddy(t) {
    ctx.save();
    ctx.translate(t.x, t.y);

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(0, 14, 18, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(t.angle + Math.PI / 2);
    const bob = Math.abs(Math.sin(t.walkT)) * 1.8;
    ctx.translate(0, -bob);

    // Beine
    const legS = Math.sin(t.walkT) * 5;
    ctx.fillStyle = '#7a5a3a';
    ctx.beginPath();
    ctx.ellipse(-7, 10 + legS * 0.3, 5, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse( 7, 10 - legS * 0.3, 5, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Körper (dunkler, gruseliger Teddy)
    ctx.fillStyle = '#7a5a3a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    // Bauch-Patch
    ctx.fillStyle = '#a78054';
    ctx.beginPath();
    ctx.ellipse(0, 2, 8, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    // Nähte
    ctx.strokeStyle = '#3b2412';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(0, -8); ctx.lineTo(0, 14);
    ctx.stroke();
    ctx.setLineDash([]);

    // Arme
    const armS = -Math.sin(t.walkT) * 4;
    ctx.fillStyle = '#7a5a3a';
    ctx.beginPath();
    ctx.ellipse(-14, 0 + armS, 5, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse( 14, 0 - armS, 5, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // Kopf
    ctx.fillStyle = '#7a5a3a';
    ctx.beginPath();
    ctx.arc(0, -13, 12, 0, Math.PI * 2);
    ctx.fill();
    // Ohren
    ctx.beginPath();
    ctx.arc(-9, -20, 5, 0, Math.PI * 2);
    ctx.arc( 9, -20, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5b3f24';
    ctx.beginPath();
    ctx.arc(-9, -20, 2.5, 0, Math.PI * 2);
    ctx.arc( 9, -20, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Schnauze
    ctx.fillStyle = '#a78054';
    ctx.beginPath();
    ctx.ellipse(0, -10, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Nase
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(0, -12, 2, 1.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Gruselige Augen — rot leuchtend wenn Spieler gesehen
    const seeing = t.seeT > 0;
    if (seeing) {
      // Glow
      const g = ctx.createRadialGradient(-4, -14, 0, -4, -14, 8);
      g.addColorStop(0, 'rgba(255, 50, 50, 0.8)');
      g.addColorStop(1, 'rgba(255, 50, 50, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(-4, -14, 8, 0, Math.PI * 2); ctx.fill();
      const g2 = ctx.createRadialGradient(4, -14, 0, 4, -14, 8);
      g2.addColorStop(0, 'rgba(255, 50, 50, 0.8)');
      g2.addColorStop(1, 'rgba(255, 50, 50, 0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(4, -14, 8, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#ff1744';
    } else {
      ctx.fillStyle = '#1a1208';
    }
    ctx.beginPath();
    ctx.arc(-4, -14, 2, 0, Math.PI * 2);
    ctx.arc( 4, -14, 2, 0, Math.PI * 2);
    ctx.fill();

    // X über Auge (kaputt)
    ctx.strokeStyle = '#3b2412';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-6, -16); ctx.lineTo(-2, -12);
    ctx.moveTo(-6, -12); ctx.lineTo(-2, -16);
    ctx.stroke();

    // Mund — Reißzähne wenn jagend
    if (seeing) {
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(0, -8, 4, 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(-3, -8); ctx.lineTo(-2, -6); ctx.lineTo(-1, -8); ctx.closePath();
      ctx.moveTo( 3, -8); ctx.lineTo( 2, -6); ctx.lineTo( 1, -8); ctx.closePath();
      ctx.fill();
    } else {
      ctx.strokeStyle = '#3b2412';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, -9, 3, Math.PI, 2 * Math.PI);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawOverlay() {
    if (won) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffeb3b';
      ctx.textAlign = 'center';
      ctx.font = 'bold 64px sans-serif';
      ctx.fillText('Geschafft!', W / 2, H / 2 - 40);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('Alle 🍯 gesammelt in ' + elapsed.toFixed(1) + 's', W / 2, H / 2 + 10);
      ctx.font = '20px sans-serif';
      ctx.fillText('Klick oder Leertaste = nochmal', W / 2, H / 2 + 60);
      ctx.textAlign = 'start';
    } else if (dead) {
      ctx.fillStyle = 'rgba(40,0,0,0.65)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e63946';
      ctx.textAlign = 'center';
      ctx.font = 'bold 70px sans-serif';
      ctx.fillText('Erwischt!', W / 2, H / 2 - 50);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('Überlebt: ' + elapsed.toFixed(1) + 's', W / 2, H / 2);
      ctx.fillText('🍯 gesammelt: ' + (8 - honeys.length) + ' / 8', W / 2, H / 2 + 36);
      ctx.font = '20px sans-serif';
      ctx.fillText('Klick oder Leertaste = nochmal', W / 2, H / 2 + 90);
      ctx.textAlign = 'start';
    } else if (!running) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 64px sans-serif';
      ctx.fillText('Teddy Chase', W / 2, H / 2 - 60);
      ctx.font = '20px sans-serif';
      ctx.fillText('WASD oder Pfeiltasten = Bewegen', W / 2, H / 2 - 10);
      ctx.fillText('Sammle alle 🍯 Honiggläser', W / 2, H / 2 + 20);
      ctx.fillText('Renne vor den gruseligen Teddys weg!', W / 2, H / 2 + 50);
      ctx.fillStyle = '#ff1744';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('⚠ Rote Augen = er hat dich gesehen', W / 2, H / 2 + 80);
      ctx.fillStyle = '#ffeb3b';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText('Klick zum Starten', W / 2, H / 2 + 130);
      ctx.textAlign = 'start';
    }
  }

  // ---------- Loop ----------
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000 || 0);
    lastT = now;

    update(dt);

    drawFloor();
    drawWalls();
    drawHoneys();
    for (const t of teddies) drawTeddy(t);
    if (player) drawPlayer();
    drawParticles();
    drawVignette();
    drawOverlay();

    requestAnimationFrame(loop);
  }

  // Initiale Anzeige (Startscreen)
  player = null;
  teddies = [];
  honeys = [];
  particles = [];
  // Demo-Teddy auf Startscreen
  teddies.push({
    x: W * 0.7, y: H * 0.4,
    vx: 0, vy: 0,
    angle: -Math.PI,
    walkT: 0, seeT: 0, lastSeenX: 0, lastSeenY: 0,
    hasTarget: false, growl: 0,
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
